server:
  port: 8083

spring:
  application:
    name: queue-service
  data:
    redis:
      lettuce:
        pool:
          max-active: 32   # 50K 사용자 폴링 부하에서 커넥션 풀 고갈 방지 (기본값 8은 불충분)
          min-idle: 8
          max-idle: 16
          max-wait: 100ms
  config:
    import:
      - "optional:classpath:/application-common-${spring.profiles.active}.yml"
      - "optional:aws-secretsmanager:queue-svc/secure-config"

feign:
  client:
    config:
      event-service:
        url: ${EVENT_SERVICE_URL:http://localhost:8082}
        connectTimeout: 3000
        readTimeout: 5000

queue:
  batch:
    size: 10
    interval: 1000
  token:
    ttl: 600
  max-capacity: 50000
  active-user:
    ttl: 600
  rate-limit:
    max-requests: 15
    window-seconds: 60

management:
  server:
    port: 9083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
