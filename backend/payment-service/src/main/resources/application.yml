server:
  port: 8085

spring:
  application:
    name: payment-service
  config:
    import:
      - "optional:classpath:/application-common-${spring.profiles.active}.yml"
      - "optional:classpath:/application-common-web-${spring.profiles.active}.yml"
      - "optional:aws-secretsmanager:payment-svc/secure-config"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payment_service
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketqueue.*
    listener:
      ack-mode: MANUAL_IMMEDIATE

outbox:
  poller:
    enabled: true
    max-retry-count: 3
    batch-size: 100
    fixed-delay: 1000
  cleanup:
    enabled: true
    aggregate-type: Payment
    retention-days: 7

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 10000
      portone-v2-client:
        connect-timeout: 2000
        read-timeout: 10000
      reservation-service:
        url: http://localhost:8084

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      portone-v2-client:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
    instances:
      portone-v2-client:
        baseConfig: default

internal:
  api:
    key: ${INTERNAL_API_KEY:internal-api-key-for-dev}

management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers
  endpoint:
    health:
      show-details: always
