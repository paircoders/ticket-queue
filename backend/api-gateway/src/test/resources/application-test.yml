server:
  port: 0
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway-test

  codec:
    max-in-memory-size: 1MB

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "https://ticketing.vercel.app"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Queue-Token
                exposed-headers:
                  - X-Queue-Token
                allow-credentials: true
                max-age: 3600
          max-request-size: 1MB
          routes:
            # /internal/** 차단 라우트 (테스트 환경)
            # 내부 API는 외부 접근 차단
            - id: block-internal-api
              uri: no://op
              predicates:
                - Path=/internal/**
              filters:
                - SetStatus=404
              order: -1

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**,/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/user
                - name: RequestSize
                  args:
                    maxSize: 10KB

            - id: event-service
              uri: http://localhost:8082
              predicates:
                - Path=/events/**,/venues/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: eventService
                    fallbackUri: forward:/fallback/event

            - id: queue-service
              uri: http://localhost:8083
              predicates:
                - Path=/queue/**
              metadata:
                response-timeout: 10000
              filters:
                - name: CircuitBreaker
                  args:
                    name: queueService
                    fallbackUri: forward:/fallback/queue

            - id: reservation-service
              uri: http://localhost:8084
              predicates:
                - Path=/reservations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reservationService
                    fallbackUri: forward:/fallback/reservation

            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/payments/**
              metadata:
                response-timeout: 60000
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentService
                    fallbackUri: forward:/fallback/payment

          httpclient:
            connect-timeout: 1000
            response-timeout: 5s

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tdmVyaWZpY2F0aW9uLXRlc3Rpbmc=

# 테스트 환경용 Resilience4j 설정 (빠른 검증을 위해 축소된 값 사용)
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      userService:
        baseConfig: default
      eventService:
        baseConfig: default
      queueService:
        baseConfig: default
      reservationService:
        baseConfig: default
      paymentService:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
        cancelRunningFuture: true
    instances:
      userService:
        baseConfig: default
      eventService:
        baseConfig: default
      queueService:
        baseConfig: default
        timeoutDuration: 3s      # Production: 10s → 테스트 축소
      reservationService:
        baseConfig: default
      paymentService:
        baseConfig: default
        timeoutDuration: 10s     # Production: 60s → 테스트 축소

management:
  endpoints:
    web:
      exposure:
        include: health
