# Local development profile
# 로컬 개발 환경 전용 설정

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "https://ticketing.vercel.app"
                  - "http://localhost:3000"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
