server:
  port: 8080
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway

  codec:
    max-in-memory-size: 1MB

  data:
    redis:
      host: ${REDIS_HOST:192.168.50.111}
      port: ${REDIS_PORT:6379}
      password: ${valkey_password}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "https://ticketing.vercel.app"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Queue-Token
                exposed-headers:
                  - X-Queue-Token
                allow-credentials: true
                max-age: 3600
          max-request-size: 1MB
          routes:
            # /internal/** 차단 라우트 (최우선 순위)
            # 내부 API는 외부 접근 차단
            - id: block-internal-api
              uri: no://op
              predicates:
                - Path=/internal/**
              filters:
                - SetStatus=404
              order: -1

            # 기본 라우트 구조 정의 (세부 필터는 향후 추가 예정)
            - id: user-service
              uri: ${SERVICE_URI_USER:http://192.168.50.111:8081}
              predicates:
                - Path=/auth/**,/users/**
              filters:
                - name: RequestSize
                  args:
                    maxSize: 10KB

            - id: event-service
              uri: ${SERVICE_URI_EVENT:http://192.168.50.111:8082}
              predicates:
                - Path=/events/**,/venues/**

            - id: queue-service
              uri: ${SERVICE_URI_QUEUE:http://192.168.50.111:8083}
              predicates:
                - Path=/queue/**

            - id: reservation-service
              uri: ${SERVICE_URI_RESERVATION:http://192.168.50.111:8084}
              predicates:
                - Path=/reservations/**

            - id: payment-service
              uri: ${SERVICE_URI_PAYMENT:http://192.168.50.111:8085}
              predicates:
                - Path=/payments/**

jwt:
  secret: ${jwt_secret}

# 기본 Resilience4j 설정 구조
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized
    gateway:
      access: read_only