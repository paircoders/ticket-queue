server:
  port: 8080
  max-http-request-header-size: 16KB

spring:
  application:
    name: api-gateway
  config:
    import:
      - "optional:aws-secretsmanager:common/secure-config"

  http:
    codecs:
      max-in-memory-size: 1MB

  data:
    redis:
      host: ${REDIS_HOST:192.168.50.111}
      port: ${REDIS_PORT:6379}
      password: ${valkey_password}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000    # 5초 연결 타임아웃
            response-timeout: 30s    # 30초 글로벌 응답 타임아웃
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "https://ticketing.vercel.app"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Queue-Token
                exposed-headers:
                  - X-Queue-Token
                allow-credentials: true
                max-age: 3600
          max-request-size: 1MB
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@globalRedisRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
          routes:
            # /internal/** 차단 라우트 (최우선 순위)
            # 내부 API는 외부 접근 차단
            - id: block-internal-api
              uri: no://op
              predicates:
                - Path=/internal/**
              filters:
                - SetStatus=404
              order: -1

            - id: user-service
              uri: ${SERVICE_URI_USER:http://192.168.50.111:8081}
              predicates:
                - Path=/auth/**,/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userService
                    fallbackUri: forward:/fallback/user
                - name: RequestSize
                  args:
                    maxSize: 10KB

            - id: event-service
              uri: ${SERVICE_URI_EVENT:http://192.168.50.111:8082}
              predicates:
                - Path=/events/**,/venues/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: eventService
                    fallbackUri: forward:/fallback/event

            - id: queue-service                          # 10초 타임아웃
              uri: ${SERVICE_URI_QUEUE:http://192.168.50.111:8083}
              predicates:
                - Path=/queue/**
              metadata:
                response-timeout: 10000
              filters:
                - name: CircuitBreaker
                  args:
                    name: queueService
                    fallbackUri: forward:/fallback/queue

            - id: reservation-service
              uri: ${SERVICE_URI_RESERVATION:http://192.168.50.111:8084}
              predicates:
                - Path=/reservations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reservationService
                    fallbackUri: forward:/fallback/reservation

            - id: payment-service                        # 60초 타임아웃
              uri: ${SERVICE_URI_PAYMENT:http://192.168.50.111:8085}
              predicates:
                - Path=/payments/**
              metadata:
                response-timeout: 60000
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentService
                    fallbackUri: forward:/fallback/payment
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter: "#{@paymentRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"

jwt:
  secret: ${jwt_secret}

# Resilience4j Circuit Breaker + TimeLimiter 설정
# TimeLimiter 필수 이유: ReactiveResilience4JCircuitBreakerFactory가 내부적으로 TimeLimiter를 함께 감싸며,
# 미설정 시 기본 1초로 모든 요청이 타임아웃됨.
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 100
        minimumNumberOfCalls: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 10
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      userService:
        baseConfig: default
      eventService:
        baseConfig: default
      queueService:
        baseConfig: default
      reservationService:
        baseConfig: default
      paymentService:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true
    instances:
      userService:
        baseConfig: default
      eventService:
        baseConfig: default
      queueService:
        baseConfig: default
        timeoutDuration: 10s     # Queue 10초
      reservationService:
        baseConfig: default
      paymentService:
        baseConfig: default
        timeoutDuration: 60s     # Payment 60초

management:
  server:
    port: 9080
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: when-authorized
    gateway:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
