server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import:
      - "optional:classpath:/application-common-${spring.profiles.active}.yml"
      - "optional:classpath:/application-common-web-${spring.profiles.active}.yml"
      - "optional:aws-secretsmanager:user-svc/secure-config"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user_service
        format_sql: true
    show-sql: false
    open-in-view: false

jwt:
  secret: ${jwt_secret}
  access-token-expiry: 3600000  # 1 hour in milliseconds
  refresh-token-expiry: 604800000  # 7 days in milliseconds

internal:
  api:
    key: ${internal_api_key}

management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

recaptcha:
  url: https://www.google.com/recaptcha/api/siteverify
  secret: ${recaptcha_secret}

feign:
  circuitbreaker:
    enabled: false
  client:
    config:
      default:
        connect-timeout: 2000
        read-timeout: 5000
      portone-v2-client:
        connect-timeout: 2000
        read-timeout: 10000

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100        # 최근 100번 호출을 표본으로 삼음
        minimumNumberOfCalls: 5      # 최소 5번은 호출되어야 실패율 계산을 시작함
        failureRateThreshold: 50     # 실패율이 50% 이상(표본 내 절반 이상)이면 차단
        waitDurationInOpenState: 60s # 차단(OPEN) 상태를 60초간 유지 후 HALF-OPEN으로 전환
        permittedNumberOfCallsInHalfOpenState: 3 # 복구 확인을 위해 3번만 먼저 호출
        ignoreExceptions:
          - com.ticketqueue.common.exception.BusinessException
        recordExceptions:
          - com.ticketqueue.common.exception.ExternalSystemException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      portone-v2-client:
        baseConfig: default
      recaptcha:
        baseConfig: default
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80