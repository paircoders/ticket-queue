server:
  port: 8084

spring:
  application:
    name: reservation-service
  config:
    import:
      - "optional:classpath:/application-common-${spring.profiles.active}.yml"
      - "optional:aws-secretsmanager:reservation-svc/secure-config"

outbox:
  poller:
    enabled: true
    max-retry-count: 3
    batch-size: 100
    fixed-delay: 1000
  cleanup:
    enabled: true
    aggregate-type: Reservation
    retention-days: 7

processed-event:
  cleanup:
    enabled: true
    retention-days: 30

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: reservation_service
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reservation-payment-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketqueue.*
    listener:
      ack-mode: MANUAL_IMMEDIATE

redisson:
  single-server-config:
    address: redis://localhost:6379
  lock:
    wait-time: 15000  # 15 seconds
    lease-time: 300000  # 5 minutes

reservation:
  hold:
    ttl: 300  # 5 minutes in seconds
  max-seats: 4

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
      event-service:
        url: http://localhost:8082
        connect-timeout: 2000
        read-timeout: 3000

internal:
  api:
    key: ${INTERNAL_API_KEY:internal-api-key-for-dev}

management:
  server:
    port: 9084
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
