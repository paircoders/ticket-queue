spring:
  config:
    import: ""   # aws-secretsmanager import 비활성화
  cloud:
    aws:
      secretsmanager:
        enabled: false
    openfeign:
      client:
        config:
          event-service:
            url: http://localhost:8082
  # Kafka: @EnableKafka + @KafkaListener(PaymentEventConsumer)가 kafkaListenerContainerFactory
  # 빈을 요구하므로 KafkaAutoConfiguration 은 프로덕션과 동일하게 활성 상태로 둔다.
  # 단, 리스너 컨테이너는 기동하지 않아(auto-startup=false) 브로커 연결을 시도하지 않으므로
  # 컨텍스트 로드에 실제 Kafka 브로커가 필요 없다. 실제 브로커가 필요한 e2e 테스트
  # (ReservationOutboxPollerIntegrationTest)는 @DynamicPropertySource 로 testcontainer
  # 주소를 주입하고 자체 KafkaConsumer 로 검증한다.
  kafka:
    listener:
      auto-startup: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: reservation_service

internal:
  api:
    key: test-internal-api-key

# Outbox 폴러 및 정리 배치 비활성화
outbox:
  poller:
    enabled: false
  cleanup:
    enabled: false

processed-event:
  cleanup:
    enabled: false
