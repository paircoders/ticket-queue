server:
  port: 8082

processed-event:
  cleanup:
    enabled: true
    retention-days: 30

spring:
  application:
    name: event-service
  config:
    import:
      - "optional:classpath:/application-common-${spring.profiles.active}.yml"
      - "optional:classpath:/application-common-web-${spring.profiles.active}.yml"
      - "optional:aws-secretsmanager:event-svc/secure-config"

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: event_service
        format_sql: true
    show-sql: false
    open-in-view: false

cache:
  event:
    ttl: 300  # 5 minutes in seconds
  schedule:
    ttl: 300
  seats:
    ttl: 300
  layout:
    ttl: 86400  # 24 hours — 홀 좌석 배치도는 거의 변경되지 않음

internal:
  api:
    key: ${INTERNAL_API_KEY:internal-api-key-for-dev}

management:
  server:
    port: 9082
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
