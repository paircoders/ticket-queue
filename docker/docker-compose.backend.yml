services:
  api-gateway:
    image: ghcr.io/paircoders/ticket-queue/api-gateway:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
      args:
        APP_NAME: api-gateway
    container_name: ticket-api-gateway
    ports:
      - "8080:8080"
      - "9080:9080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
      SPRING_CLOUD_AWS_SECRETSMANAGER_ENDPOINT: http://localstack:4566
      REDIS_HOST: valkey
      SERVICE_URI_USER: http://user-service:8081
      SERVICE_URI_EVENT: http://event-service:8082
      SERVICE_URI_QUEUE: http://queue-service:8083
      SERVICE_URI_RESERVATION: http://reservation-service:8084
      SERVICE_URI_PAYMENT: http://payment-service:8085
    volumes:
      - ../logs:/app/logs
    depends_on:
      valkey:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  user-service:
    image: ghcr.io/paircoders/ticket-queue/user-service:latest
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
      args:
        APP_NAME: user-service
    container_name: ticket-user-service
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2
      SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY: test
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: test
      SPRING_CLOUD_AWS_SECRETSMANAGER_ENDPOINT: http://localstack:4566
    volumes:
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_started
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:9081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  event-service:
